name: Aggiorna attività

on:
  schedule:
    - cron: '0 6 * * 1,4'   # ogni lunedì e giovedì alle 06:00 UTC
  workflow_dispatch: {}      # permette anche l'avvio manuale da GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa le dipendenze
        run: pip install -r scripts/requirements.txt

      - name: Aggiorna le attività (scraping + classificazione)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_activities.py

      - name: Notifica su Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_telegram.py

      - name: Pubblica i cambiamenti
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/activities.json
          git diff --cached --quiet || git commit -m "Aggiornamento automatico attività"
          git push
