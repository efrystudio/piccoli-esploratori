<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piccoli Esploratori — Calendario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header class="site-header">
    <h1 class="wordmark">Piccoli Esploratori</h1>
    <p class="tagline">Le attività della settimana per bambini a Orbassano, Rivalta di Torino e Rivoli.</p>
    <nav class="tabs">
      <a class="tab-btn" href="index.html">Novità</a>
      <a class="tab-btn active" href="calendario.html">Calendario</a>
    </nav>
  </header>

  <section id="calendar">
    <div class="calendar-header">
      <button id="prevMonth" aria-label="Mese precedente">‹</button>
      <h2 id="calendarLabel"></h2>
      <button id="nextMonth" aria-label="Mese successivo">›</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </section>

  <footer>Aggiornato automaticamente due volte a settimana.</footer>
</div>

<div id="panelOverlay" class="panel-overlay"></div>
<aside id="detailPanel" class="detail-panel" aria-hidden="true">
  <button class="panel-close" id="panelClose" aria-label="Chiudi">×</button>
  <div id="panelContent"></div>
</aside>
<script src="assets/app.js"></script>
</body>
</html>
